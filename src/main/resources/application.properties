spring.application.name=back-admin-management

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/floridos
spring.datasource.username=floridos
spring.datasource.password=floridos123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# JWT Configuration
jwt.secret=floridos-super-secret-key
jwt.expiration=86400
jwt.refresh-expiration=604800

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.storage.type=local
app.storage.local-path=./uploads
